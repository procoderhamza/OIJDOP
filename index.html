<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        #display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
            background-color: #eee;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #555;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #777;
        }
        .operator {
            background-color: #f39c12;
        }
        .operator:hover {
            background-color: #e67e22;
        }
        .equals {
            background-color: #27ae60;
            grid-column: span 2;
        }
        .equals:hover {
            background-color: #2ecc71;
        }
        .clear {
            background-color: #c0392b;
            grid-column: span 2;
        }
        .clear:hover {
            background-color: #e74c3c;
        }
        .voice-status {
            color: white;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">Clear</button>
            <button class="operator" onclick="appendToDisplay('/')">/</button>
            <button class="operator" onclick="appendToDisplay('*')">*</button>

            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>

            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>

            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="equals" onclick="calculate()">=</button>

            <button onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendToDisplay('.')">.</button>
        </div>
        <div class="voice-status" id="status">Voice commands: "Calculate 2 plus 2", "Clear"</div>
        <button id="voice-btn" style="width: 100%; margin-top: 10px; background-color: #2980b9;">Start Voice Listening</button>
        <div style="margin-top: 10px;">
            <input type="text" id="test-command" placeholder="Type command to simulate voice" style="width: calc(100% - 70px); padding: 5px;">
            <button onclick="simulateVoice()" style="width: 60px; padding: 5px; font-size: 12px; background-color: #7f8c8d;">Simulate</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const status = document.getElementById('status');

        function appendToDisplay(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = 'Error';
            }
        }

        // Voice Recognition
        const voiceBtn = document.getElementById('voice-btn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                status.innerText = 'Listening...';
            });

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript.toLowerCase();
                status.innerText = 'You said: ' + command;
                processCommand(command);
            };

            recognition.onspeechend = () => {
                recognition.stop();
            };

            recognition.onerror = (event) => {
                status.innerText = 'Error occurred in recognition: ' + event.error;
            };
        } else {
            voiceBtn.style.display = 'none';
            status.innerText = 'Speech recognition not supported in this browser.';
        }

        function simulateVoice() {
            const cmd = document.getElementById('test-command').value;
            status.innerText = 'Simulated: ' + cmd;
            processCommand(cmd.toLowerCase());
        }

        function processCommand(command) {
            if (command.includes('clear')) {
                clearDisplay();
                return;
            }

            // Command should be like "calculate 5 plus 5" or "5 plus 5"
            let expression = command.replace('calculate', '').trim();

            // Map common spoken operators to mathematical symbols
            const operators = {
                'plus': '+',
                'minus': '-',
                'multiplied by': '*',
                'times': '*',
                'divided by': '/',
                'x': '*',
                'by': '/'
            };

            for (let op in operators) {
                expression = expression.split(op).join(operators[op]);
            }

            // Clean up any extra words
            expression = expression.replace(/[^0-9+\-*/.]/g, '');

            if (expression) {
                display.value = expression;
                calculate();
            } else {
                status.innerText = "Couldn't understand the command: " + command;
            }
        }
    </script>
</body>
</html>
